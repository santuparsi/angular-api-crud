<div class="container">
    <button class="btn btn-primary" (click)="addNew()">Add Product</button>
    <table class="table table-stripped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Price</th>
                <th></th>
            </tr>
        </thead>
        <tbody>
            @for(product of products;track $index)
            {
            <tr>
                <td>{{product.id}}</td>
                <td>{{product.name}}</td>
                <td>{{product.price}}</td>
                <td>
                    <button class="btn btn-primary" (click)="edit(product.name)">Edit</button> &nbsp;
                    <button class="btn btn-info" (click)="delete(product.id)">Delete</button>
                </td>

            </tr>
            }
        </tbody>
    </table>
</div>
